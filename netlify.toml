# ═══════════════════════════════════════════════════════
# NETLIFY CONFIG — Segura Contable
# ═══════════════════════════════════════════════════════

[build]
  command = "mkdir -p dist && cp index.html portal.html sw.js manifest.json icon-192.png icon-512.png _redirects dist/"
  publish = "dist"

# HTML: sin caché (siempre versión más reciente)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Service Worker: sin caché
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Assets estáticos: caché 1 año
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"
