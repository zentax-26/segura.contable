<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Segura Contable — Acceso</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#E8909A">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased}
:root{--rosa:#E8909A;--rosa-l:#F5C4CB;--rosa-d:#C96878;--blur:blur(24px) saturate(180%);--r-sm:9px}
body{background:#0A0A0A;min-height:100vh;display:flex;position:relative;overflow:hidden}
body::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 60% at 20% 50%,rgba(232,144,154,.15) 0%,transparent 60%),radial-gradient(ellipse 40% 40% at 80% 20%,rgba(232,144,154,.08) 0%,transparent 50%)}
.left{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;position:relative;z-index:1}
.logo-wrap{margin-bottom:32px;text-align:center}
.logo-wrap img{width:220px;height:auto;background:rgba(255,255,255,.08);border-radius:16px;padding:16px}
.tagline{font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:300;color:#fff;line-height:1.15;letter-spacing:-1px;max-width:380px}
.tagline strong{color:var(--rosa-l);font-weight:600}
.tagline-sub{font-size:14px;color:rgba(255,255,255,.35);margin-top:16px;line-height:1.7;max-width:320px}
.dots{display:flex;gap:8px;margin-top:40px}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15)}
.dot:first-child{background:var(--rosa);width:20px;border-radius:3px}
.right{width:440px;min-height:100vh;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04);backdrop-filter:var(--blur);border-left:1px solid rgba(255,255,255,.07);position:relative;z-index:1;padding:40px}
.form-wrap{width:100%;max-width:360px}
.form-logo{margin-bottom:28px;text-align:center}
.form-logo img{width:140px;height:auto;background:rgba(255,255,255,.08);border-radius:12px;padding:10px}
.form-title{font-size:28px;font-weight:700;color:#fff;margin-bottom:6px;letter-spacing:-.5px}
.form-sub{font-size:13px;color:rgba(255,255,255,.35);margin-bottom:28px}
.err{background:rgba(232,144,154,.15);color:var(--rosa-l);padding:11px 16px;border-radius:var(--r-sm);font-size:13px;margin-bottom:16px;border:1px solid rgba(232,144,154,.2);display:none}
.fgrp{margin-bottom:16px}
.flbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.3);font-weight:600;margin-bottom:7px;display:block}
.finput{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;padding:13px 16px;font-size:14px;border-radius:var(--r-sm);outline:none;transition:all .2s;font-family:inherit}
.finput:focus{border-color:rgba(232,144,154,.5);background:rgba(255,255,255,.09);box-shadow:0 0 0 3px rgba(232,144,154,.1)}
.finput::placeholder{color:rgba(255,255,255,.2)}
.fbtn{width:100%;margin-top:8px;padding:14px;background:linear-gradient(135deg,var(--rosa),var(--rosa-d));color:#fff;border:none;font-size:14px;font-weight:700;border-radius:var(--r-sm);cursor:pointer;transition:all .22s;box-shadow:0 12px 40px rgba(232,144,154,.35);font-family:inherit}
.fbtn:hover{transform:translateY(-2px)}
.fbtn:disabled{opacity:.6;cursor:not-allowed;transform:none}
@media(max-width:768px){body{flex-direction:column}.left{display:none}.right{width:100%;min-height:100vh;border-left:none}}
</style>
</head>
<body>

<div class="left">
  <div class="logo-wrap">
    <img id="logo-left" src="" alt="Segura Contable">
  </div>
  <div class="tagline">Soluciones<br>contables<br><strong>inteligentes.</strong></div>
  <div class="tagline-sub">Plataforma administrativa integral para despachos contables. Gestión de clientes, RRHH, documentos y más.</div>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>

<div class="right">
  <div class="form-wrap">
    <div class="form-logo"><img id="logo-form" src="" alt="Segura Contable"></div>
    <div class="form-title">Bienvenido</div>
    <div class="form-sub">Ingresa tus credenciales para continuar</div>
    <div class="err" id="err-box"></div>
    <div class="fgrp">
      <label class="flbl">Correo electrónico</label>
      <input class="finput" id="f-email" type="email" placeholder="tu@correo.com" autocomplete="email">
    </div>
    <div class="fgrp">
      <label class="flbl">Contraseña</label>
      <input class="finput" id="f-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="fbtn" id="btn-login" onclick="login()">Ingresar →</button>
  </div>
</div>

const logoSrc = 'data:image/jpeg;base64,' + LOGO_B64
document.getElementById('logo-left').src = logoSrc
document.getElementById('logo-form').src = logoSrc

function showErr(msg) {
  var el = document.getElementById('err-box')
  el.textContent = msg; el.style.display = 'block'
}
function hideErr() { document.getElementById('err-box').style.display = 'none' }

document.addEventListener('keydown', function(e) { if (e.key === 'Enter') login() })

async function login() {
  hideErr()
  var email = document.getElementById('f-email').value.trim().toLowerCase()
  var pass  = document.getElementById('f-pass').value
  if (!email || !pass) { showErr('Ingresa tu correo y contraseña'); return }

  var btn = document.getElementById('btn-login')
  btn.disabled = true; btn.textContent = 'Ingresando…'

  try {
    // Admin
    var admin = ADMINS.find(function(u) { return u.email === email && u.pass === pass })
    if (admin) {
      sessionStorage.setItem('sc_user', JSON.stringify(admin))
      window.location.href = '/portal.html'
      return
    }
    // Cliente desde Supabase
    var res = await _sb.from('sc_usuarios').select('*').eq('email', email).eq('pass', pass).eq('rol','cliente').single()
    if (res.error || !res.data) { showErr('Correo o contraseña incorrectos'); return }
    if (!res.data.activo) { showErr('Cuenta desactivada. Contacta a tu asesor.'); return }
    sessionStorage.setItem('sc_user', JSON.stringify(res.data))
    window.location.href = '/portal.html'
  } catch(e) {
    showErr('Error de conexión')
    console.error(e)
  } finally {
    btn.disabled = false; btn.textContent = 'Ingresar →'
  }
}
</script>
